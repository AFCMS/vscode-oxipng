---
name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to VS Code Marketplace"
        required: false
        default: "false"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vscode:
    name: VSCode Extension
    runs-on: ubuntu-latest
    env:
      RUST_CHANNEL: stable
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # - name: Install Rust toolchain
      #   run: |
      #     rustup update --no-self-update ${{ env.RUST_CHANNEL }}
      #     rustup component add --toolchain ${{ env.RUST_CHANNEL }} rustfmt rust-src
      #     rustup default ${{ env.RUST_CHANNEL }}
      #     rustup target add wasm32-unknown-unknown

      - name: Setup PNPM
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: true

      - name: Lint
        run: pnpm run lint

      - name: Build VSCode Extension
        run: pnpx @vscode/vsce package --no-dependencies

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: "*.vsix"

      # - name: Publish to VS Code Marketplace
      #   if: success() && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true')
      #   run: pnpx @vscode/vsce publish
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
